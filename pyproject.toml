[project]
name = "tscribe-class-carnyx"
version = "0.1.0"
description = "Thin HTTP server wrapping tscribe's verified class_pipeline, for carnyx behind a Cloudflare Tunnel."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    # The transcription/verification logic — single source of truth.
    # Requires the class_pipeline package (tscribe-transcription-tool PR #1).
    "transcription-tool @ git+https://github.com/danialrami/tscribe-transcription-tool.git",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uvicorn]
# uvicorn server.app:app --host 127.0.0.1 --port 6390
